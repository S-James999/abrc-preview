<style>
:root{
  --bg:#F3F3F5; --surface:#FFFFFF; --sunk:#ECECF0; --line:#DADAE0; --text:#101014; --muted:#5A5A66;
  --accent:#D10A1C; --accent-ink:#FFFFFF; --accent-soft:#FDE6E8; --accent-text:#B00818; --hero-a:#D10A1C; --hero-b:#7A0612;
  --pos:#00875A; --pos-soft:#DDF5EA; --neg:#C2410C; --warn:#8A6A00; --warn-soft:#FBF1CC; --purple:#7E22CE; --purple-soft:#F1E6FC;
  --chip:#ECECF0; --wa:#1FA855; --wa-ink:#FFFFFF; --carbon:transparent;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0F; --surface:#15151C; --sunk:#101016; --line:#272731; --text:#FFFFFF; --muted:#9C9CAB;
    --accent:#E10A1E; --accent-ink:#FFFFFF; --accent-soft:#2B0D12; --accent-text:#FF4D5E; --hero-a:#E10A1E; --hero-b:#5E0610;
    --pos:#19D67A; --pos-soft:#0E2B1D; --neg:#FF7A45; --warn:#FFD60A; --warn-soft:#2B2508; --purple:#C27BFF; --purple-soft:#24133A;
    --chip:#22222B; --wa:#25D366; --wa-ink:#0B0B0F; --carbon:rgba(255,255,255,.018); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0F; --surface:#15151C; --sunk:#101016; --line:#272731; --text:#FFFFFF; --muted:#9C9CAB;
  --accent:#E10A1E; --accent-ink:#FFFFFF; --accent-soft:#2B0D12; --accent-text:#FF4D5E; --hero-a:#E10A1E; --hero-b:#5E0610;
  --pos:#19D67A; --pos-soft:#0E2B1D; --neg:#FF7A45; --warn:#FFD60A; --warn-soft:#2B2508; --purple:#C27BFF; --purple-soft:#24133A;
  --chip:#22222B; --wa:#25D366; --wa-ink:#0B0B0F; --carbon:rgba(255,255,255,.018); color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:repeating-linear-gradient(45deg,var(--carbon) 0 2px,transparent 2px 6px),repeating-linear-gradient(-45deg,var(--carbon) 0 2px,transparent 2px 6px);color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif,'Noto Color Emoji';font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;min-height:56px;margin:0 -16px;padding:0 16px;border-bottom:1px solid var(--line)}
.mark{flex:none;width:28px;height:28px}
.brand{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:11px;letter-spacing:0;color:var(--muted);margin-top:2px}
.spacer{flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--muted)}
.tag.ok{background:var(--pos-soft);color:var(--pos)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.acc{background:var(--accent-soft);color:var(--accent-text)}
.back{width:44px;height:44px;margin-left:-10px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:10px}
h1,h2,h3{margin:0}
.display{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;line-height:.95}
.screen{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.label{font-size:13px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:0;font-weight:700;font-size:15px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn[disabled]{background:var(--chip);color:var(--muted);cursor:not-allowed;border:0}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 12px;font-size:13px;border-radius:9px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 0 var(--line)}
.seg small{font-size:11px;font-weight:600}
.chipbar{flex:none;width:4px;border-radius:2px}
.slot{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left}
.slot .pos{flex:none;width:44px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px}
.slot .pos.sm{font-size:16px;letter-spacing:.02em}
.slot .name{font-size:16px;font-weight:600}
.slot .name.empty{color:var(--muted)}
.slot .pts{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.teampill{display:inline-flex;align-items:center;gap:6px;min-height:22px;padding:0 8px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:4px;flex:none}
.list{display:flex;flex-direction:column;gap:8px}
.tbl-row{display:grid;align-items:center;gap:8px;min-height:52px;border-top:1px solid var(--line)}
.tbl-row:first-child{border-top:0}
.big{font-family:'Barlow Condensed',sans-serif;font-weight:700}
.up{color:var(--pos);font-weight:700;font-size:13px}
.down{color:var(--neg);font-weight:700;font-size:13px}
.same{color:var(--muted);font-weight:700;font-size:13px}
.avatar{flex:none;width:32px;height:32px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#0F1115}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600}
.nav a[aria-current="page"]{color:var(--accent-text)}
.dock{position:fixed;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--bg);border-top:1px solid var(--line)}
.dock-in{max-width:480px;margin:0 auto;padding:10px 16px}
.has-dock .app{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(5,6,8,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:85vh;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 6px 20px}
.sheet-list{overflow-y:auto;padding-bottom:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 20px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.opt[aria-selected="true"]{background:var(--sunk)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gcell{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--sunk);border-top:2px solid var(--line);min-width:0}
.gcell:nth-child(even){transform:translateY(12px)}
.switch{flex:none;width:48px;height:28px;border-radius:14px;border:0;padding:3px;display:flex;background:var(--chip)}
.switch span{width:22px;height:22px;border-radius:11px;background:var(--muted)}
.switch[aria-checked="true"],.switch[aria-pressed="true"]{justify-content:flex-end;background:var(--accent)}
.switch[aria-checked="true"] span,.switch[aria-pressed="true"] span{background:var(--accent-ink)}
.check{display:flex;align-items:center;gap:10px;font-size:14px}
.ic{flex:none;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.ic.ok{background:var(--pos-soft);color:var(--pos)}
.ic.warn{background:var(--warn-soft);color:var(--warn)}
textarea,input[type=text],input[type=time],select{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--sunk)}
textarea{min-height:320px;line-height:1.5;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600}
.banner{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);font-size:13px;font-weight:600}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 4px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--text);text-decoration:none;text-align:left}
.menu > :first-child{border-top:0}
.chev{margin-left:auto;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600;line-height:1}
.stepper output{min-width:44px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px}
.stepper output.changed{color:var(--accent-text)}

/* racing look */
.display{font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.big{font-style:italic;font-weight:800}
.brand{font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.top{border-bottom:0;background:var(--bg)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:conic-gradient(var(--text) 25%,transparent 0 50%,var(--text) 0 75%,transparent 0) 0 0/12px 12px;opacity:.85}
.label{text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.card{border-radius:12px}
.tag{border-radius:4px;text-transform:uppercase;letter-spacing:.04em;font-size:11px}
.btn{border-radius:8px;text-transform:uppercase;letter-spacing:.04em;font-style:italic;font-weight:800}
.btn.sm{font-size:12px}
.btn.primary{box-shadow:0 6px 18px -8px var(--accent)}
.slot{border-radius:10px;position:relative;overflow:hidden}
.slot .pos{width:46px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--text);color:var(--bg);transform:skewX(-12deg);border-radius:4px;font-size:20px}
.slot .pos.sm{font-size:14px}
.hero{background:radial-gradient(120% 90% at 100% 0%,rgba(225,10,30,.22),transparent 55%),linear-gradient(160deg,#1C1C24,#0D0D12);border:1px solid #2A2A34;color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:0;bottom:0;right:-30px;width:120px;background:repeating-linear-gradient(115deg,rgba(225,10,30,.55) 0 6px,transparent 6px 18px);transform:skewX(-12deg);opacity:.35;pointer-events:none}
.hero::after{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,#E10A1E,#FF4D5E 60%,transparent)}
.hero > *{position:relative}
.hero .label{color:#FF4D5E}
.hero .muted{color:#B5B5C3}
.hero .cd{flex:1;text-align:center;padding:10px 0 8px;border-radius:8px;background:#111117;border:1px solid #2E2E39;border-bottom:3px solid #E10A1E}
.hero .btn.primary{background:#E10A1E;color:#fff;box-shadow:0 8px 22px -10px #E10A1E}
.hero .ic.ok{background:rgba(25,214,122,.18);color:#19D67A}.hero .ic.warn{background:#FFD60A;color:#1a1400}
.lights{display:flex;gap:6px;align-items:center}
.lights span{width:16px;height:16px;border-radius:8px;background:#26262E;box-shadow:inset 0 0 0 2px #3A3A46}
.lights span.on{background:#ff2a2a;box-shadow:0 0 10px 2px rgba(255,40,40,.75)}
.tpos{width:30px;height:28px;display:flex;align-items:center;justify-content:center;transform:skewX(-12deg);border-radius:3px;background:var(--chip);font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:800;font-size:18px}
.tpos.p1{background:var(--accent);color:var(--accent-ink)}
.stripe{width:4px;height:26px;border-radius:2px;flex:none}
.purple{display:inline-flex;align-items:center;white-space:nowrap;flex:none;min-height:20px;padding:0 6px;border-radius:4px;background:var(--purple-soft);color:var(--purple);font-size:11px;font-weight:800;font-style:italic;text-transform:uppercase}
.nav{border-top:0;box-shadow:0 -1px 0 var(--line)}
.nav a{position:relative;text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:700}
.nav a[aria-current="page"]{color:var(--text)}
.nav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.seg button{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:12px}
.switch[aria-checked="true"],.switch[aria-pressed="true"]{background:var(--accent)}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

<script>

var flag = function (cc) { return cc ? cc.replace(/./g, function (ch) { return String.fromCodePoint(127397 + ch.charCodeAt(0)); }) + ' ' : ''; };

var TEAMS = {

ring, as playing it today would have kept him top of the table!!\n\nSo what does this do to the league?\n\n1st – Ellie – with a total of 286 points (up from 2nd last week)\n2nd – Dad – with a total of 279 points (down from 1st)\n3rd – Jack – with a total of 262 points (up from 4th)\n4th – Mum – with a total of 251 points (down from 3rd)\n5th – Grandad – with a total of 233 points\n6th – Auntie Sue – with a total of 219 points\n\nJust 7 points between the top two with five races left, so it’s all to play for.\n\nNext weekend we head to the Autódromo Hermanos Rodríguez for the Mexico City Grand Prix. It’s the highest race of the year, the long run down to Turn 1 always makes for a lively start, and the stadium section at the end of the lap has one of the best atmospheres on the calendar. Picks lock at lights out on Sunday, so get them in early.\n\nHave a good rest of your weekends!!\n\nABRC',

  document.body.classList.toggle('has-dock', docked);
  var focusId = document.activeElement && document.activeElement.id, val = document.activeElement && document.activeElement.value, pos = document.activeElement && document.activeElement.selectionStart;
  document.getElementById('root').innerHTML = '<div class="app">' + VIEWS[S.route]() + '</div>' + (S.route === 'signin' ? '' : nav()) + sheet() + (S.bd ? breakdownSheet() : '') + (S.aboutSheet ? aboutSheet() : '') + (S.splitSheet ? splitSheet() : '') + (S.tour && S.route !== 'signin' ? tourSheet() : '') + (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + '</div>' : '');
  if (S.route === 'followup') paintShareCard();
  if (focusId) { var el = document.getElementById(focusId); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-news],[data-newsf],[data-split],[data-card],[data-wk],[data-wkmine],[data-about],[data-form],[data-fp],[data-theme-set],[data-tour-close],[data-tour-open],[data-q],[data-bd],[data-focus],[data-signin],[data-step],[data-rules],[data-go],[data-open],[data-nom],[data-choose],[data-close],[data-act],[data-session],[data-season],[data-toggle],[data-jokers],[data-rev],[data-fu-act]');
  if (!t) return;
  if (t.dataset.close && e.target.closest('.sheet') && !e.target.closest('[data-close].back')) { if (!t.classList.contains('back') && t.classList.contains('sheet-wrap')) return; }
  if (t.dataset.bd) { S.bd = t.dataset.bd; S.bdMode = t.dataset.mode || 'admin'; render(); return; }
  if (t.dataset.news) { S.newsRevealed = true; render(); return; }
  if (t.dataset.newsf) { S.newsFilter = t.dataset.newsf; render(); return; }
  if (t.dataset.split) { S.splitSheet = true; render(); return; }
  if (t.dataset.card) {
    var c = S.cardCanvas; if (!c) return;
    if (t.dataset.card === 'share' && c.toBlob) {
      c.toBlob(function (blob) {
        try { var file = new File([blob], 'abrc-round-18.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'ABRC Formula 1 League · Round 18' }).catch(function () {}); return; } } catch (err) {}
        toast('Sharing isn’t available here. Use Save image instead.');
      });
      return;
    }
    try { var a = document.createElement('a'); a.href = S.cardUrl; a.download = 'abrc-round-18.png'; document.body.appendChild(a); a.click(); a.remove(); toast('Image saved'); } catch (err) { toast('Press and hold the image to save it'); }
    return;
  }
  if (t.dataset.wk) { S.wk = t.dataset.wk; render(); return; }
  if (t.dataset.wkmine) { S.wkMine = !S.wkMine; render(); return; }
  if (t.dataset.about) { S.aboutSheet = true; render(); return; }
  if (t.dataset.form) { S.formTab = t.dataset.form; render(); return; }
  if (t.dataset.fp) { S.fp = t.dataset.fp; render(); return; }
  if (t.dataset.themeSet) { S.theme = t.dataset.themeSet; try { localStorage.setItem('abrc-theme', S.theme); } catch (err) {} applyTheme(); render(); return; }
  if (t.dataset.tourClose) { if (t.classList.contains('sheet-wrap') && e.target !== t) return; S.tour = false; try { localStorage.setItem('abrc-tour-seen', '1'); } catch (err) {} render(); return; }
  if (t.dataset.tourOpen) { S.tour = true; render(); return; }
  if (t.dataset.q) { var Q = S.q; if (t.dataset.q === 'open') Q.open = true; if (t.dataset.q === 'cancel') Q.open = false; if (t.dataset.q === 'send' && Q.line) { Q.sent = true; Q.open = false; } render(); return; }
  if (t.dataset.focus) { S.chartFocus = S.chartFocus === t.dataset.focus ? null : t.dataset.focus; render(); return; }
  if (t.dataset.signin) {
    var a1 = t.dataset.signin, G = S.signin;
    if (a1 === 'send') G.sent = true;
    if (a1 === 'resend') { toast('Sent again'); return; }
    if (a1 === 'change') G.sent = false;
    if (a1 === 'open') { G.sent = false; S.signedIn = true; go('home'); toast('Signed in. You’ll stay signed in on this phone.'); return; }
    if (a1 === 'out') { S.signedIn = false; G.sent = false; go('signin'); return; }
    render(); return;
  }
  if (t.dataset.step) {
    var p = t.dataset.step.split(':'), k = p[0], dlt = +p[1], lim = k === 'carry' ? [0, 100] : k === 'jokers' ? [0, 10] : [0, 50];
    S.rd[k] = Math.min(lim[1], Math.max(lim[0], S.rd[k] + dlt * (k === 'carry' ? 5 : 1))); render(); return;
  }
  if (t.dataset.rules === 'discard') { S.rd = JSON.parse(JSON.stringify(S.rdBase)); S.applyFrom = 'next'; render(); return; }
  if (t.dataset.rules === 'save') {
    ['gp', 'sprint'].forEach(function (g) { DEFS[g].forEach(function (d) { d.pts = S.rd[g + '.' + d.k]; }); });
    NOMS.forEach(function (n) { n.pts = S.rd['nom.' + n.k]; });
    S.jokersTotal = S.rd.jokers; S.jokersLeft = Math.min(S.jokersLeft, S.jokersTotal); S.carry = S.rd.carry;
    S.rdBase = JSON.parse(JSON.stringify(S.rd)); var all = S.applyFrom === 'all'; S.applyFrom = 'next';
    toast(all ? 'Rules saved. Season rescored.' : 'Rules saved. They apply from Mexico City.'); return;
  }
  if (t.dataset.go) { e.preventDefault(); if (t.dataset.fu && t.dataset.fu !== S.fu.kind) S.fu = { kind: t.dataset.fu, version: 0, edited: null, note: '', noteInput: '', shared: false, skipped: false }; go(t.dataset.go); return; }
  if (t.dataset.open) { S.sheet = { type: 'pick', key: t.dataset.open }; render(); return; }
  if (t.dataset.nom) { S.sheet = { type: 'nom', key: t.dataset.nom }; render(); return; }
  if (t.dataset.choose !== undefined) {
    if (S.sheet.type === 'pick') { var sess = S.sprint ? S.session : 'gp'; S.picks[sess][S.sheet.key] = t.dataset.choose; S.submitted[sess] = false; }
    else { S.noms[S.sheet.key] = t.dataset.choose; S.nomsSealed = false; }
    S.sheet = null; render(); return;
  }
  if (t.dataset.close) { if (t.classList.contains('sheet-wrap') && e.target !== t) return; S.sheet = null; S.bd = null; S.aboutSheet = false; S.splitSheet = false; render(); return; }
  if (t.dataset.session) { S.session = t.dataset.session; render(); return; }
  if (t.dataset.season) { S.seasonTab = t.dataset.season; render(); return; }
  if (t.dataset.toggle) { S[t.dataset.toggle] = !S[t.dataset.toggle]; if (t.dataset.toggle === 'postRace' || t.dataset.toggle === 'spoilerShield') S.newsRevealed = false; if (t.dataset.toggle === 'sprint') S.session = S.sprint ? 'sprint' : 'gp'; render(); return; }
  if (t.dataset.jokers) { S.jokersLeft = +t.dataset.jokers; if (!S.jokersLeft) S.joker = false; render(); return; }
  if (t.dataset.rev) {
    var a = t.dataset.rev.split(':'), R = S.review;
    if (a[0] === 'confirm') { R.confirmed = true; toast('Scores confirmed. The table is updated.'); return; }
    if (a[0] === 'queryResolved') { R.queryResolved = true; toast('Query resolved. Dad has been sent the decision.'); return; }
    if (a[0] === 'reopen') R.confirmed = false; else { R[a[0]] = a[1]; R.confirmed = false; }
    render(); return;
  }
  if (t.dataset.fuAct) {
    var F = S.fu, act = t.dataset.fuAct;
    if (act === 'regen') { F.version++; F.edited = null; }
    if (act === 'note' && F.noteInput.trim()) { F.note = F.noteInput.trim(); F.edited = null; }
    if (act === 'copy') { try { navigator.clipboard.writeText(fuText()); } catch (err) {} toast('Copied'); return; }
    if (act === 'skip') F.skipped = true;
    if (act === 'unskip') F.skipped = false;
    if (act === 'share') { F.shared = true; setTimeout(render, 50); return; }
    render(); return;
  }
  var act2 = t.dataset.act;
  if (act2 === 'grid') S.showGrid = !S.showGrid;
  if (act2 === 'joker' && S.jokersLeft > 0) { S.joker = !S.joker; S.submitted.gp = false; S.submitted.sprint = false; }
  if (act2 === 'submit') { var ss = S.sprint ? S.session : 'gp'; S.submitted[ss] = true; S.submittedAt[ss] = Date.now(); toast('Picks submitted ' + ukTime(S.submittedAt[ss])); return; }
  if (act2 === 'edit') S.submitted[S.sprint ? S.session : 'gp'] = false;
  if (act2 === 'seal') { S.nomsSealed = true; toast('Nominations sealed'); return; }
  if (act2 === 'unseal') S.nomsSealed = false;
  render();
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.hasAttribute('data-fuedit')) { S.fu.edited = t.value; }
  if (t.hasAttribute('data-funote')) { S.fu.noteInput = t.value; }
  if (t.hasAttribute('data-qnote')) { S.q.note = t.value; }
  if (t.hasAttribute('data-signin-email')) { var was = /.+@.+\..+/.test(S.signin.email); S.signin.email = t.value; if (was !== /.+@.+\..+/.test(t.value)) render(); }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.hasAttribute('data-revlock')) { S.review.lock = t.value || '20:00'; S.review.confirmed = false; render(); }
  if (t.hasAttribute('data-applyfrom')) { S.applyFrom = t.value; render(); }
  if (t.hasAttribute('data-qline')) { S.q.line = t.value; render(); }
  if (t.hasAttribute('data-revdotd')) { S.review.dotd = t.value; S.review.confirmed = false; render(); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (S.sheet || S.bd || S.tour || S.aboutSheet || S.splitSheet)) { S.sheet = null; S.bd = null; S.tour = false; S.aboutSheet = false; S.splitSheet = false; render(); } });
window.addEventListener('hashchange', function () { readHash(); S.sheet = null; render(); });
setInterval(function () { if (S.route === 'home' && !document.activeElement.matches('input,textarea,select')) render(); }, 30000);
try { if (localStorage.getItem('abrc-tour-seen')) S.tour = false; var th = localStorage.getItem('abrc-theme'); if (th) S.theme = th; } catch (err) {}
function applyTheme() { var el = document.documentElement; if (S.theme === 'auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme', S.theme); }
applyTheme();
readHash(); render();
})();
</script>
</body>
